# Nombre fijo: las imágenes se llaman datadock-server y datadock-client sin importar la carpeta del clon
name: datadock

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5128/api
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - datadock-network
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5128:5128"
    # Credenciales de base de datos (DB_*): se leen de server/.env si existe.
    # Las variables de "environment" tienen prioridad sobre este archivo.
    env_file:
      - path: ./server/.env
        required: false
    # Permite usar DB_SERVER=host.docker.internal para un SQL Server que corre en la máquina anfitriona
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - PORT=5128
      - HOST=0.0.0.0
      - CORS_ENABLED=true
      - CORS_ORIGIN=http://localhost,https://datadock.netlify.app
      - UPLOAD_CLEANUP_ENABLED=true
      - UPLOAD_RETENTION_DAYS=30
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5128/status-server"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - datadock-network
    restart: unless-stopped

networks:
  datadock-network:
    driver: bridge

volumes:
  uploads:
    driver: local
